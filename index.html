<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Car Racing Game</title>

    <!-- INTERNAL CSS -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Game Area */
        .game {
            position: relative;
            width: 400px;
            height: 700px;
            background: #333;
            overflow: hidden;
            border-left: 8px solid #222;
            border-right: 8px solid #222;
        }

        /* Road */
        .road {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #444;
        }

        /* Road Lines */
        .line {
            position: absolute;
            width: 8px;
            height: 100px;
            background: white;
            left: 50%;
            transform: translateX(-50%);
        }

        .line1 {
            top: -100px;
        }

        .line2 {
            top: 150px;
        }

        .line3 {
            top: 400px;
        }

        .line4 {
            top: 650px;
        }

        /* Roadside */
        .side-line {
            position: absolute;
            width: 8px;
            height: 100%;
            background: #f5d142;
            top: 0;
        }

        .side-left {
            left: 20px;
        }

        .side-right {
            right: 20px;
        }

        /* Player Car */
        .player {
            position: absolute;
            width: 55px;
            height: 95px;
            background: #e60000;
            bottom: 40px;
            left: 172px;
            border-radius: 12px;
            z-index: 10;
            box-shadow: 0 0 10px #000;
        }

        /* Car Window */
        .player::before {
            content: "";
            position: absolute;
            width: 35px;
            height: 28px;
            background: #87ceeb;
            top: 12px;
            left: 10px;
            border-radius: 5px;
        }

        /* Car Bumper */
        .player::after {
            content: "";
            position: absolute;
            width: 45px;
            height: 10px;
            background: #990000;
            bottom: 10px;
            left: 5px;
            border-radius: 5px;
        }

        /* Enemy Cars */
        .enemy {
            position: absolute;
            width: 55px;
            height: 95px;
            background: #0066ff;
            border-radius: 12px;
            top: -120px;
            z-index: 5;
        }

        .enemy::before {
            content: "";
            position: absolute;
            width: 35px;
            height: 28px;
            background: #222;
            top: 12px;
            left: 10px;
            border-radius: 5px;
        }

        /* Game Information */
        .score {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            z-index: 20;
        }

        .speed {
            position: absolute;
            top: 45px;
            left: 15px;
            color: #ffd700;
            font-size: 16px;
            z-index: 20;
        }

        /* Start Screen */
        .start-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .start-screen h1 {
            font-size: 40px;
            color: #ff3333;
            margin-bottom: 15px;
        }

        .start-screen p {
            margin-bottom: 25px;
            font-size: 16px;
        }

        .start-button {
            background: #ff3333;
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
        }

        .start-button:hover {
            background: #cc0000;
        }

        /* Game Over Screen */
        .game-over {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            color: white;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        .game-over h1 {
            color: red;
            font-size: 45px;
            margin-bottom: 15px;
        }

        .restart-button {
            margin-top: 20px;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            background: #00cc66;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        /* Mobile Controls */
        .controls {
            position: fixed;
            bottom: 20px;
            display: none;
            gap: 20px;
            z-index: 200;
        }

        .control-button {
            width: 70px;
            height: 60px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.8);
            font-size: 25px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .game {
                width: 100vw;
                height: 100vh;
                border: none;
            }

            .controls {
                display: flex;
            }
        }
    </style>
</head>

<body>

    <div class="game" id="game">

        <div class="road"></div>

        <!-- Roadside lines -->
        <div class="side-line side-left"></div>
        <div class="side-line side-right"></div>

        <!-- Moving road lines -->
        <div class="line line1"></div>
        <div class="line line2"></div>
        <div class="line line3"></div>
        <div class="line line4"></div>

        <!-- Score -->
        <div class="score">
            Score: <span id="score">0</span>
        </div>

        <div class="speed">
            Speed: <span id="speed">5</span>
        </div>

        <!-- Player Car -->
        <div class="player" id="player"></div>

        <!-- Enemy Cars -->
        <div class="enemy" id="enemy1"></div>
        <div class="enemy" id="enemy2"></div>

        <!-- Start Screen -->
        <div class="start-screen" id="startScreen">
            <h1>🏎️ CAR RACE</h1>
            <p>Use ← and → arrow keys to move</p>
            <p>Avoid the other cars!</p>

            <button class="start-button" onclick="startGame()">
                START GAME
            </button>
        </div>

        <!-- Game Over -->
        <div class="game-over" id="gameOver">
            <h1>GAME OVER</h1>

            <p>Your Score:</p>
            <h2 id="finalScore">0</h2>

            <button class="restart-button" onclick="restartGame()">
                PLAY AGAIN
            </button>
        </div>

    </div>

    <!-- Mobile Controls -->
    <div class="controls">
        <button class="control-button" onclick="moveLeft()">⬅️</button>
        <button class="control-button" onclick="moveRight()">➡️</button>
    </div>


    <!-- JAVASCRIPT -->
    <script>

        const player = document.getElementById("player");
        const enemy1 = document.getElementById("enemy1");
        const enemy2 = document.getElementById("enemy2");

        const scoreDisplay = document.getElementById("score");
        const speedDisplay = document.getElementById("speed");

        const startScreen = document.getElementById("startScreen");
        const gameOverScreen = document.getElementById("gameOver");
        const finalScore = document.getElementById("finalScore");

        const lines = document.querySelectorAll(".line");

        let playerPosition = 172;
        let score = 0;
        let speed = 5;
        let gameRunning = false;

        let enemy1Position = -120;
        let enemy2Position = -400;

        /* Start Game */
        function startGame() {

            startScreen.style.display = "none";
            gameOverScreen.style.display = "none";

            playerPosition = 172;
            score = 0;
            speed = 5;

            player.style.left = playerPosition + "px";

            enemy1Position = -120;
            enemy2Position = -400;

            enemy1.style.top = enemy1Position + "px";
            enemy2.style.top = enemy2Position + "px";

            gameRunning = true;

            gameLoop();
        }


        /* Restart Game */
        function restartGame() {
            startGame();
        }


        /* Move Left */
        function moveLeft() {

            if (!gameRunning) return;

            if (playerPosition > 35) {
                playerPosition -= 25;
                player.style.left = playerPosition + "px";
            }
        }


        /* Move Right */
        function moveRight() {

            if (!gameRunning) return;

            if (playerPosition < 310) {
                playerPosition += 25;
                player.style.left = playerPosition + "px";
            }
        }


        /* Keyboard Controls */
        document.addEventListener("keydown", function(event) {

            if (event.key === "ArrowLeft") {
                moveLeft();
            }

            if (event.key === "ArrowRight") {
                moveRight();
            }

        });


        /* Collision Detection */
        function collision(player, enemy) {

            const playerRect = player.getBoundingClientRect();
            const enemyRect = enemy.getBoundingClientRect();

            return !(
                playerRect.bottom < enemyRect.top ||
                playerRect.top > enemyRect.bottom ||
                playerRect.right < enemyRect.left ||
                playerRect.left > enemyRect.right
            );
        }


        /* Main Game Loop */
        function gameLoop() {

            if (!gameRunning) return;

            /* Move road lines */

            lines.forEach(function(line) {

                let top = parseInt(
                    window.getComputedStyle(line).top
                );

                top += speed;

                if (top > 700) {
                    top = -100;
                }

                line.style.top = top + "px";
            });


            /* Move Enemy 1 */

            enemy1Position += speed;

            if (enemy1Position > 700) {

                enemy1Position = -120;

                const randomPosition =
                    Math.floor(Math.random() * 6) * 55 + 35;

                enemy1.style.left =
                    randomPosition + "px";

                score++;

                scoreDisplay.textContent = score;
            }

            enemy1.style.top =
                enemy1Position + "px";


            /* Move Enemy 2 */

            enemy2Position += speed;

            if (enemy2Position > 700) {

                enemy2Position = -120;

                const randomPosition =
                    Math.floor(Math.random() * 6) * 55 + 35;

                enemy2.style.left =
                    randomPosition + "px";

                score++;

                scoreDisplay.textContent = score;
            }

            enemy2.style.top =
                enemy2Position + "px";


            /* Increase speed */

            if (score > 0 && score % 10 === 0) {
                speed = 5 + Math.floor(score / 10);
                speedDisplay.textContent = speed;
            }


            /* Check collision */

            if (
                collision(player, enemy1) ||
                collision(player, enemy2)
            ) {

                endGame();
                return;
            }


            requestAnimationFrame(gameLoop);
        }


        /* End Game */

        function endGame() {

            gameRunning = false;

            finalScore.textContent = score;

            gameOverScreen.style.display = "flex";
        }

    </script>

</body>
</html>
